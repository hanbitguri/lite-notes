<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>라이트 노트</title>
<meta name="description" content="가볍게 쓰는 문서 노트 · Notion·Markdown·Word 가져오기/내보내기">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="라이트 노트">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="side-top">
      <div class="brand"><span class="logo">📝</span><b>라이트 노트</b></div>
      <button id="collapse-btn" class="icon-btn" aria-label="사이드바 닫기" title="사이드바 (⌘\)">⟨</button>
    </div>
    <button id="search-btn" class="side-btn"><span>⌕</span>검색<kbd>⌘K</kbd></button>
    <button id="new-page" class="side-btn primary"><span>＋</span>새 페이지</button>
    <p class="side-label">페이지</p>
    <nav id="tree" aria-label="페이지 트리"></nav>
    <div class="side-bottom">
      <button id="import-btn" class="side-btn"><span>⤒</span>가져오기</button>
      <button id="export-all" class="side-btn"><span>⤓</span>전체 내보내기</button>
      <button id="theme-btn" class="side-btn">☾ 다크 모드</button>
      <button id="keys-btn" class="side-btn"><span>⌨︎</span>단축키</button>
    </div>
  </aside>
  <div id="nav-scrim"></div>
  <main id="main">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="메뉴">☰</button>
      <nav id="crumbs" aria-label="경로"></nav>
      <span id="saved" data-state="saved">저장됨</span>
      <button id="search-btn-m" class="icon-btn m-only" aria-label="검색">⌕</button>
      <button id="export-btn" class="pill">내보내기</button>
      <button id="more-btn" class="icon-btn" data-pop aria-label="더보기">⋯</button>
    </header>
    <div id="scroller">
      <article id="page">
        <div id="page-head"></div>
        <div id="editor"></div>
      </article>
    </div>
  </main>
</div>
<div id="scrim"></div>
<div id="toasts"></div>
<div id="busy"></div>
<script type="module" src="dist/main.js?v=1"></script>
</body>
</html>
